<!DOCTYPE html>
<html lang="zh‑CN">
<head>
<meta charset="UTF‑8" />
<meta name="viewport" content="width=device‑width, initial‑scale=1.0"/>
<title>Mr‑Wu‑Raven | Homepage</title>
<style>
*{
  margin:0;
  padding:0;
  box‑sizing:border‑box;
}
body{
  min‑height:100vh;
  /*深色渐变背景，Calm UI风格 */
  background‑image: linear‑gradient(145deg,#0b101c,#141b2d,#182238);
  color:#e2e8f0;
  font‑family: system‑ui, "JetBrains Mono",‑apple‑system, sans‑serif;
  padding: 42px 18px;
}
.container{
  max‑width:1140px;
  margin:0 auto;
}
/* Bento Grid 便当网格核心 */
.bento‑grid{
  display: grid;
  grid‑template‑columns: repeat(3, 1fr);
  gap: 20px;
}
/* Liquid Glass 液态玻璃卡片 */
.glass{
  background‑color: rgba(255,255,255,0.07);
  backdrop‑filter: blur(18px);
  ‑webkit‑backdrop‑filter: blur(18px);
  border:1px solid rgba(255,255,255,0.13);
  border‑radius: 22px;
  padding:26px;
  transition: 0.32s ease‑all;
}
.glass:hover{
  background‑color:rgba(255,255,255,0.11);
  transform: translateY(‑5px);
  box‑shadow: 0 12px 40px rgba(0,0,0,0.28);
  border‑color:rgba(148,212,255,0.22);
}
/* 网格跨列规格 */
.big‑2{grid‑column: span 2;}
.full‑3{grid‑column: span 3;}

h1{
  font‑size:2.45rem;
  margin‑bottom:10px;
  color:#f8fafc;
}
.sub‑title{
  color:#94a3b8;
  font‑size:1.08rem;
}
h2{
  font‑size:1.32rem;
  margin‑bottom:14px;
  color:#cbd5e1;
}
p,li{
  color:#94a3b8;
  line‑height:1.7;
}
ul{
  padding‑left:22px;
}
.link‑group a{
  display: inline‑block;
  text‑decoration:none;
  color:#93c5fd;
  padding:9px 15px;
  border‑radius:12px;
  background‑color:rgba(255,255,255,0.06);
  margin:7px 10px 7px 0;
  transition:0.25s;
}
.link‑group a:hover{
  background‑color:rgba(255,255,255,0.13);
}
.hitokoto‑text{
  margin‑top:14px;
  color:#7dd3fc;
  font‑style:italic;
}
/* 手机端响应式，Bento网格变为单列 */
@media(max‑width:768px){
  .bento‑grid{
    grid‑template‑columns: 1fr;
  }
  .big‑2,.full‑3{
    grid‑column: span 1;
  }
  h1{font‑size:1.9rem;}
}
</style>
</head>
<body>
<div class="container">
<div class="bento‑grid">

  <!-- 头部大卡片 占2格 -->
  <div class="glass big‑2">
    <h1>Mr‑Wu‑Raven</h1>
    <div class="sub‑title">OI算法｜Web开发｜古风文字爱好者</div>
    <div class="hitokoto‑text" id="yiyan">✨ 加载一言句子……</div>
    <div class="link‑group" style="margin‑top:18px;">
      <a href="https://github.com/Mr‑Wu‑Raven">GitHub</a>
    </div>
  </div>

  <!-- 关于我 -->
  <div class="glass">
    <h2>关于我</h2>
    <p>热爱算法竞赛，喜爱清冷古风文字，探索网页UI设计。</p>
  </div>

  <!-- 技术栈 -->
  <div class="glass">
    <h2>技术栈</h2>
    <ul>
      <li>C++ / OI算法</li>
      <li>HTML + CSS + JS</li>
      <li>静态网页、GitHub Pages</li>
    </ul>
  </div>

  <!-- 工具资源 -->
  <div class="glass">
    <h2>常用资源</h2>
    <ul>
      <li>Luogu / AtCoder</li>
      <li>VSCode</li>
      <li>LaTeX公式编辑</li>
    </ul>
  </div>

  <!-- 项目区域 占满整行3格 -->
  <div class="glass full‑3">
    <h2>📌 精选项目</h2>
    <p>后续可以在这里填写你的项目描述与链接。</p>
    <div class="link‑group" style="margin‑top:10px;">
      <a href="#">项目示例1</a>
      <a href="#">项目示例2</a>
    </div>
  </div>

</div>
</div>

<script>
// 调用一言v1接口，静态页面兼容GitHub Pages
fetch("https://v1.hitokoto.cn/?encode=json")
.then(res=>res.json())
.then(data=>{
  document.getElementById("yiyan").innerText = `「${data.hitokoto}」 ——${data.from}`
})
.catch(()=>{
  document.getElementById("yiyan").innerText = "✨风月从来皆薄幸，山河依旧少温情。"
})
</script>
</body>
</html>
